name = "chess-ai"
main = "worker/src/fullstack-worker.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

# Next.js static assets
assets = { directory = ".vercel/output/static", binding = "ASSETS" }

[vars]
WORKER_ENV = "development"

[[d1_databases]]
binding = "DB"
database_name = "chess-llm-db"
database_id = "09d5a988-3a7b-4266-bd63-338be284be2d"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "OPENINGS_KV"
id = "cfb1f6a5302747f49ff73b785fdd2771"

[[durable_objects.bindings]]
name = "GAME_DO"
class_name = "GameDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDO"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true