# Top-level configuration
name = "chess-ai-worker" # The name of your worker
main = "worker/index.ts" # The entry point for your worker
compatibility_date = "2024-03-20" # A recent compatibility date is recommended

# Durable Objects configuration
# This section defines the binding for our GameSession Durable Object.
[durable_objects]
bindings = [
  { name = "GAME_SESSIONS", class_name = "GameSession" }
]

# Migration for the Durable Object.
# This specifies the class that the migration applies to.
[[migrations]]
tag = "v1" # A unique identifier for this migration
new_classes = ["GameSession"] # The new Durable Object class being introduced

# Configuration for the development server
[dev]
command = "npm run dev:next" # Command to run the Next.js dev server
port = 3000 # The port Next.js runs on