name = "chess-ai"
main = "worker/src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Serve Next.js static assets from /out directory
[site]
bucket = "./out"

[vars]
WORKER_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "chess-llm-db"
database_id = "09d5a988-3a7b-4266-bd63-338be284be2d"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "OPENINGS_KV"
id = "cfb1f6a5302747f49ff73b785fdd2771"

[[durable_objects.bindings]]
name = "GAME_DO"
class_name = "GameDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDO"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true