name = "chess-llm"
main = "worker/src/index.ts"
compatibility_date = "2024-06-20"
node_compat = true

[vars]
WORKER_ENV = "development"

[[d1_databases]]
binding = "DB"
database_name = "chess-llm-db"
database_id = "a1b2c3d4-e5f6-7890-1234-567890abcdef"

[[kv_namespaces]]
binding = "OPENINGS_KV"
id = "0123456789abcdef0123456789abcdef"
preview_id = "0123456789abcdef0123456789abcdef"

[[durable_objects.bindings]]
name = "GAME_DO"
class_name = "GameDO"
script_name = "chess-llm"

[migrations]
dir = "worker/migrations"