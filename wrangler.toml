name = "gamebench"
main = "server/src/cloudflare/worker.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
OPENROUTER_APP_TITLE = "GameBench"

[[durable_objects.bindings]]
name = "BENCHMARK_RUN"
class_name = "BenchmarkRun"

[[durable_objects.bindings]]
name = "ARENA_REGISTRY"
class_name = "ArenaRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BenchmarkRun", "ArenaRegistry"]

[observability]
enabled = true
