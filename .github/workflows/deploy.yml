# Deploy Cloudflare Fullstack Single Worker

name: Deploy Cloudflare Fullstack

on:
  push:
    branches: [ main, claude/cloudflare-d1-deployment-011CUdUyjsytLut8wEwf6XmQ, claude/cloudflare-fullstack-deploy-011CUeA7YAHvnAqkPwjBKXKk ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Fullstack Worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js for Workers
        run: npm run build:worker

      - name: Deploy Fullstack Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy