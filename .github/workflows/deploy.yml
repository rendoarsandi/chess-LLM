# This is a basic workflow to help you get started with Actions

name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v3
      # This action is responsible for deploying your worker,
      # including D1 and KV configurations from wrangler.toml
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # You must create a secret in your GitHub repository called CLOUDFLARE_API_TOKEN
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # You must create a secret in your GitHub repository called CLOUDFLARE_ACCOUNT_ID
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}